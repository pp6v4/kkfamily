<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>扣扣的家</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #405240; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(180deg, #dff0e1, #f7f3e8); }
    main { width: min(560px, 100%); padding: 44px 28px 30px; text-align: center; border: 2px solid rgba(255,255,255,.75); border-radius: 28px; background: rgba(255,253,247,.9); box-shadow: 0 14px 30px rgba(87,124,86,.13); }
    .home { font-size: 54px; }
    h1 { margin: 16px 0 8px; font-size: 30px; }
    p { margin: 0; color: #7e8977; line-height: 1.8; }
    footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #e6e1d8; }
    a { color: #53644f; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="home" aria-hidden="true">🏡</div>
    <h1>扣扣的家</h1>
    <p>家庭生活服务正在准备中</p>
    <footer>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">辽ICP备2026020161号-1</a>
    </footer>
  </main>
</body>
</html>
